
<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBAR Juju</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: max(884px, 100dvh);
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .material-symbols-outlined.fill-1 {
            font-variation-settings: 'FILL' 1;
        }

        /* Classes utilitárias para impressão */
        .print-only {
            display: none !important;
        }

        /* Estilos de Impressão */
        @media print {
            @page {
                margin: 1.5cm;
                size: A4 portrait;
            }

            /* Mostra conteúdo específico de impressão */
            .print-only {
                display: block !important;
            }

            /* Esconde tudo que for marcado como apenas tela */
            .screen-only, header, footer, nav, aside, button, .no-print, .fixed {
                display: none !important;
            }

            /* Ajustes do corpo para impressão */
            body, #root, main {
                background-color: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: auto !important;
                overflow: visible !important;
                height: auto !important;
                font-size: 12pt;
            }

            /* Garante que textos sejam pretos */
            p, h1, h2, h3, h4, h5, h6, span, div, strong {
                color: black !important;
                -webkit-text-fill-color: black !important;
            }

            /* Remove sombras e bordas escuras de containers */
            .bg-white, .dark\:bg-slate-900\/70, .dark\:bg-background-dark {
                background: none !important;
                box-shadow: none !important;
                border: none !important;
            }
            
            /* Evita quebra de página dentro de um bloco de conteúdo, mas permite entre seções se necessário */
            .print-break-inside-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            /* Força quebra de página após cada relatório */
            .print-page-break {
                page-break-after: always;
                break-after: page;
            }

            /* Estilização específica para bordas na impressão */
            .print-border {
                border: 1px solid #000 !important;
            }
            .print-border-b {
                border-bottom: 1px solid #000 !important;
            }

            /* Mostra links como texto se necessário, ou remove sublinhado */
            a {
                text-decoration: none !important;
                color: black !important;
            }
        }
    </style>
<script type="importmap">
